<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>XY Pad Instrument</title>
<link rel="stylesheet" href="./assets/theme.css" />
<style>
/* local aliases onto the shared theme tokens — kept because the
   canvas renderer below reads --lace via getComputedStyle() */
:root{
  --lace: var(--paper);
  --charcoal: var(--ink);
  --deep: var(--ink-strong);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--lace);color:var(--charcoal);overflow:hidden}
body{overflow:hidden}.app{height:100dvh;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:14px;padding:18px clamp(18px,3vw,42px) 16px;background:var(--lace)}
header{display:grid;grid-template-columns:1fr auto;align-items:end;gap:18px;padding-bottom:6px}.title{margin:0;font-size:14px;letter-spacing:.18em;text-transform:uppercase;font-weight:300;color:var(--charcoal)}.sub{margin-top:6px;font-size:11px;letter-spacing:.08em;line-height:1.65;opacity:.72}.textBtns{display:flex;gap:18px;align-items:center;justify-content:flex-end;flex-wrap:wrap}
main{min-height:0;display:grid}.scoreWrap{min-height:0;display:grid;grid-template-columns:22px minmax(0,1fr);gap:20px}.axisY{position:relative;min-height:0}.axisY:before{content:"";position:absolute;top:0;bottom:0;left:50%;border-left:.5px solid var(--stone)}.laneDot{position:absolute;left:50%;width:5px;height:5px;border:.75px solid var(--charcoal);border-radius:50%;background:var(--lace);transform:translate(-50%,-50%);opacity:.72}.canvasBox{position:relative;min-height:0}.xGuide{position:absolute;left:0;right:0;top:-8px;border-top:.5px solid var(--stone);opacity:.78}.xGuide:after{content:"";position:absolute;right:0;top:-3px;width:6px;height:6px;border-top:.5px solid var(--stone);border-right:.5px solid var(--stone);transform:rotate(45deg)}
canvas#score{width:100%;height:clamp(420px,calc(100dvh - 158px),880px);display:block;border:.5px solid var(--stone);background:var(--lace);cursor:crosshair;touch-action:none}.transport{display:grid;grid-template-columns:auto minmax(180px,1fr) auto auto auto auto;gap:22px;align-items:end;padding-top:12px;border-top:.5px solid var(--hair)}.playBtns{display:flex;gap:16px;align-items:center}.bpm{width:58px;border:0;border-bottom:.5px solid var(--stone);background:transparent;text-align:center;font-size:12px;padding:3px 0;outline:none}.steps{display:flex;gap:clamp(10px,2.1vw,28px);align-items:flex-end;justify-content:center;min-height:44px}.step{width:18px;height:42px;position:relative;cursor:pointer}.step:before{content:"";position:absolute;bottom:15px;left:8px;width:.5px;height:var(--h);background:var(--charcoal);opacity:.55}.step:after{content:"";position:absolute;bottom:3px;left:5px;width:8px;height:8px;border-radius:50%;border:.5px solid var(--charcoal);background:var(--lace)}.step.active:after,.step.sel:after{background:var(--charcoal)}
.control select,.control input[type=number]{border:0;border-bottom:.5px solid var(--stone);background:transparent;border-radius:0;padding:4px 0;font-size:12px;outline:none}.selectWrap{position:relative;display:inline-grid;align-items:end;min-width:124px}.selectWrap:after{content:"";position:absolute;right:1px;bottom:8px;width:5px;height:5px;border-right:.5px solid var(--charcoal);border-bottom:.5px solid var(--charcoal);transform:rotate(45deg);opacity:.58;pointer-events:none}.waveSelect{appearance:none;-webkit-appearance:none;-moz-appearance:none;width:100%;border:0;border-bottom:.5px solid var(--stone);background:transparent;border-radius:0;padding:4px 18px 5px 0;font-size:12px;line-height:1.2;letter-spacing:.13em;text-transform:uppercase;text-align:left;cursor:pointer;color:var(--charcoal);outline:none}.waveSelect:hover,.waveSelect:focus{color:var(--deep);border-bottom-color:var(--deep)}.selectWrap:hover:after,.selectWrap:focus-within:after{border-color:var(--deep);opacity:.9}.waveSelect option{background:var(--lace);color:var(--charcoal)}
.outputSlider{-webkit-appearance:none;appearance:none;width:108px;height:14px;background:transparent;cursor:pointer;vertical-align:middle}.outputSlider::-webkit-slider-runnable-track{height:2px;background:var(--stone);border:0;border-radius:999px}.outputSlider::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:12px;height:12px;border-radius:50%;border:0;background:var(--charcoal);margin-top:-5px}.outputSlider::-moz-range-track{height:2px;background:var(--stone);border:0;border-radius:999px}.outputSlider::-moz-range-thumb{width:12px;height:12px;border:0;border-radius:50%;background:var(--charcoal)}.outputSlider:focus{outline:none}.outputSlider:hover::-webkit-slider-thumb{transform:scale(1.08)}.outputSlider:hover::-moz-range-thumb{transform:scale(1.08)}.hiddenEngine{display:none}.sr{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
@media(max-width:860px){body{overflow:auto}.app{min-height:100dvh;height:auto;padding:14px;gap:12px}header{grid-template-columns:1fr}.textBtns{justify-content:flex-start}.scoreWrap{grid-template-columns:14px 1fr;gap:12px}canvas#score{height:62dvh;min-height:360px}.transport{grid-template-columns:1fr 1fr;gap:16px 22px}.steps{grid-column:1/-1;justify-content:flex-start}}
@media(max-width:560px){.transport{grid-template-columns:1fr}canvas#score{height:58dvh}}
</style>
</head>
<body>
<div class="app">
  <header>
    <div><h1 class="title">XY PAD INSTRUMENT</h1><div class="sub">X AXIS: LOW → HIGH&nbsp;&nbsp;&nbsp;Y AXIS: NOTE LANE&nbsp;&nbsp;&nbsp;SPACE: RANDOM ARPEGGIATION</div></div>
    <div class="textBtns"><a class="textBtn" href="./index.html">COLLECTION</a><button id="muteTop" class="textBtn">MUTE</button><button id="full" class="textBtn">FULL</button><button id="rec" class="textBtn">REC</button><button id="exportMidi" class="textBtn">EXPORT MIDI</button></div>
  </header>
  <main><section class="scoreWrap"><div class="axisY" id="axisY"></div><div class="canvasBox"><div class="xGuide"></div><canvas id="score" aria-label="Playable X Y vector score"></canvas></div></section></main>
  <div class="transport">
    <div class="playBtns"><button id="playSeq" class="iconBtn">PLAY</button><button id="stopSeq" class="iconBtn">STOP</button><input id="bpm" class="bpm" type="number" value="90" min="30" max="220"></div>
    <div><div class="steps" id="steps"></div></div>
    <div class="control"><label>Scale</label><select id="scale"><option value="chromatic">Chromatic</option><option value="major">Major-ish</option><option value="minor">Minor-ish</option><option value="pent">Pentatonic</option></select></div>
    <div class="control"><label>Octave</label><input id="octave" type="number" value="4" min="1" max="7"></div>
    <div class="control"><label>Wave</label><span class="selectWrap"><select id="wave" class="waveSelect"><option>SINE</option><option>TRIANGLE</option><option>SAW</option><option>SQUARE</option><option>NOISE</option></select></span></div>
    <div class="control"><label>Output</label><input id="output" class="outputSlider" type="range" min="0" max="100" value="76"></div>
    <div class="hiddenEngine"><span id="atkV">0.10</span><span id="relV">1.20</span><span id="filV">0.60</span><span id="revV">0.35</span><div id="meter"></div></div>
  </div>
</div>
<div class="sr">This instrument maps X to pitch register, Y to note vector, and wave shape to oscillator color.</div>
<script>
(()=>{
const score=document.getElementById('score'),ctx=score.getContext('2d',{alpha:false});
const axisY=document.getElementById('axisY'),steps=document.getElementById('steps');
const bpmEl=document.getElementById('bpm'),waveEl=document.getElementById('wave'),outputEl=document.getElementById('output'),octaveEl=document.getElementById('octave'),scaleEl=document.getElementById('scale');
const playSeq=document.getElementById('playSeq'),stopSeq=document.getElementById('stopSeq'),muteTop=document.getElementById('muteTop'),recBtn=document.getElementById('rec'),exportMidiBtn=document.getElementById('exportMidi');
const notes=[{name:'G',pc:7,midi:67},{name:'E',pc:4,midi:64},{name:'A',pc:9,midi:69},{name:'B',pc:11,midi:71},{name:'F#',pc:6,midi:66},{name:'E',pc:4,midi:64},{name:'G',pc:7,midi:67}];
let W=1,H=1,dpr=1,AC,master,delay,fb,filter,comp,analyser,seqTimer=null,seqIndex=0,isSeq=false,muted=false,recording=false,recordStart=0;
let pointer={x:.5,y:.5,active:false,lane:0,midi:67,freq:392,energy:0};let seqOrder=[],seqXs=[];const marks=[],sessionEvents=[];let t0=performance.now();
function midiToFreq(m){return 440*Math.pow(2,(m-69)/12)}function clamp(v,a,b){return Math.max(a,Math.min(b,v))}function yToLane(y){return clamp(Math.floor((1-y)*notes.length),0,notes.length-1)}function laneToY(i){return 1-((i+.5)/notes.length)}
function quantize(midi,scale){const root=7;let best=midi,bd=999;for(let o=-2;o<9;o++)for(const s of scale){const c=root+s+12*o,d=Math.abs(c-midi);if(d<bd){bd=d;best=c}}return best}
function xToMidi(x,lane){const baseOct=parseInt(octaveEl.value||4,10),n=notes[lane];let octaveShift=Math.floor(x*4)-1,bend=(x*2-1)*2,midi=(baseOct+1)*12+n.pc+octaveShift*12+bend;if(scaleEl.value==='pent')midi=quantize(midi,[0,2,4,7,9]);if(scaleEl.value==='major')midi=quantize(midi,[0,2,4,5,7,9,11]);if(scaleEl.value==='minor')midi=quantize(midi,[0,2,3,5,7,8,10]);return midi}
function ensureAudio(){if(AC)return;AC=new(window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=(parseFloat(outputEl.value)||76)/100;comp=AC.createDynamicsCompressor();comp.threshold.value=-18;comp.ratio.value=5;filter=AC.createBiquadFilter();filter.type='lowpass';filter.frequency.value=4800;filter.Q.value=.55;delay=AC.createDelay(4);delay.delayTime.value=.34;fb=AC.createGain();fb.gain.value=.32;analyser=AC.createAnalyser();analyser.fftSize=128;delay.connect(fb).connect(delay);master.connect(filter);filter.connect(comp);comp.connect(analyser);analyser.connect(AC.destination);filter.connect(delay);delay.connect(comp)}
function playAt(x,y,hold=.9,vel=.85){ensureAudio();if(AC.state==='suspended')AC.resume();if(muted)return;x=clamp(x,0,1);y=clamp(y,0,1);const lane=yToLane(y),midi=xToMidi(x,lane),freq=midiToFreq(midi);pointer={x,y,active:true,lane,midi,freq,energy:vel};trigger(freq,lane,x,hold,vel);recordNote(midi,hold,vel,x,y,lane);marks.push({x,y,lane,midi,life:1,born:performance.now(),size:6+vel*18});if(marks.length>180)marks.shift();setActiveStep(lane)}
function toggleRecord(){ensureAudio();if(AC.state==='suspended')AC.resume();recording=!recording;if(recording){sessionEvents.length=0;recordStart=AC.currentTime;recBtn.textContent='STOP REC';recBtn.classList.add('active')}else{recBtn.textContent='REC';recBtn.classList.remove('active')}}
function recordNote(midi,dur,vel,x,y,lane){if(!recording||!AC)return;sessionEvents.push({t:Math.max(0,AC.currentTime-recordStart),midi:Math.round(midi),vel:clamp(Math.round(vel*127),1,127),dur:Math.max(.06,dur),x:+x.toFixed(4),y:+y.toFixed(4),lane,wave:waveEl.value})}
function trigger(freq,lane,x,dur,vel){const now=AC.currentTime,o1=AC.createOscillator(),o2=AC.createOscillator(),g=AC.createGain(),pan=AC.createStereoPanner(),wave=waveEl.value;const det=(x-.5)*18+(lane-3)*1.5;pan.pan.value=(x*2-1)*.86;const attack=.02+parseFloat(document.getElementById('atkV').textContent)*.45,release=.25+parseFloat(document.getElementById('relV').textContent)*1.4;const peakGain=wave==='NOISE'?Math.min(.62,.001+vel*.18*2.35):(.001+vel*.18);g.gain.setValueAtTime(0,now);g.gain.linearRampToValueAtTime(peakGain,now+attack);g.gain.exponentialRampToValueAtTime(.0001,now+attack+dur+release);if(wave==='NOISE'){const src=AC.createBufferSource(),len=Math.max(1,Math.floor(AC.sampleRate*(dur+release+attack+.18))),buf=AC.createBuffer(1,len,AC.sampleRate),data=buf.getChannelData(0);let last=0;for(let i=0;i<len;i++){const white=Math.random()*2-1;last=last*.82+white*.18;data[i]=last}const hp=AC.createBiquadFilter();hp.type='highpass';hp.frequency.setValueAtTime(120,now);hp.Q.value=.7;const nf=AC.createBiquadFilter();nf.type='bandpass';nf.frequency.setValueAtTime(clamp(freq,80,6400),now);nf.Q.value=4+x*8;src.buffer=buf;src.connect(hp).connect(nf).connect(g);g.connect(pan).connect(master);src.start(now);src.stop(now+attack+dur+release+.1)}else{const typeMap={SINE:'sine',TRIANGLE:'triangle',SAW:'sawtooth',SQUARE:'square'},oscType=typeMap[wave]||'sine';o1.type=oscType;o2.type=wave==='SINE'?'triangle':oscType;o1.frequency.setValueAtTime(freq,now);o2.frequency.setValueAtTime(freq*Math.pow(2,det/1200),now);o1.connect(g);o2.connect(g);g.connect(pan).connect(master);o1.start(now);o2.start(now);o1.stop(now+attack+dur+release+.08);o2.stop(now+attack+dur+release+.08)}}
function resize(){const r=score.getBoundingClientRect();dpr=Math.max(1,window.devicePixelRatio||1);W=Math.floor(r.width);H=Math.floor(r.height);score.width=Math.floor(W*dpr);score.height=Math.floor(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);renderAxis()}function renderAxis(){axisY.querySelectorAll('.laneDot').forEach(e=>e.remove());notes.forEach((n,i)=>{const d=document.createElement('div');d.className='laneDot';d.style.top=laneToY(i)*100+'%';axisY.appendChild(d)})}
function buildSteps(){steps.innerHTML='';notes.forEach((n,i)=>{const s=document.createElement('div');s.className='step';s.style.setProperty('--h',(18+i*4)+'px');s.addEventListener('pointerdown',()=>playAt((i+.5)/notes.length,laneToY(i),1.1,.9));steps.appendChild(s)})}function setActiveStep(i){steps.querySelectorAll('.step').forEach((s,k)=>s.classList.toggle('active',k===i))}
function draw(){const now=performance.now(),tt=(now-t0)/1000;ctx.fillStyle=getComputedStyle(document.documentElement).getPropertyValue('--lace').trim();ctx.fillRect(0,0,W,H);ctx.strokeStyle='rgba(104,103,99,.20)';ctx.lineWidth=1;ctx.setLineDash([2,7]);for(let i=1;i<9;i++){const x=W*i/9;ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}ctx.setLineDash([]);for(let i=1;i<notes.length;i++){const y=H*i/notes.length;ctx.strokeStyle='rgba(104,103,99,.22)';ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}notes.forEach((n,i)=>{const y=H*laneToY(i);ctx.strokeStyle='rgba(104,103,99,.26)';ctx.beginPath();for(let x=0;x<=W;x+=12){const yy=y+Math.sin(x*.009+tt*.22+i)*18+Math.sin(x*.021+i*1.7)*7;x===0?ctx.moveTo(x,yy):ctx.lineTo(x,yy)}ctx.stroke();for(let k=0;k<(i===3?180:110);k++){const x=(k/(i===3?180:110))*W+Math.sin(k*4.1+i)*28,density=.18+Math.pow(x/W,2)*.75;if(((k*17+i*23)%100)/100>density)continue;const yy=y+Math.sin(k*.19+tt*.35+i)*20+(Math.sin(k*91.7+i)*.5)*58,a=.045+density*.14;ctx.fillStyle=`rgba(54,55,53,${a})`;ctx.fillRect(x,yy,1,1)}});if(pointer.active){const x=pointer.x*W,y=pointer.y*H;ctx.strokeStyle='rgba(54,55,53,.78)';ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();ctx.beginPath();ctx.arc(x,y,15+Math.sin(tt*6)*2,0,Math.PI*2);ctx.stroke();ctx.beginPath();ctx.arc(x,y,5,0,Math.PI*2);ctx.fillStyle='#3A3A37';ctx.fill()}for(const m of marks){m.life*=.985;const x=m.x*W,y=m.y*H;ctx.globalAlpha=m.life;ctx.strokeStyle='#3A3A37';ctx.beginPath();ctx.arc(x,y,m.size*(1.2-m.life),0,Math.PI*2);ctx.stroke();ctx.fillStyle='#3A3A37';ctx.beginPath();ctx.arc(x,y,2+m.size*.08,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1}ctx.strokeStyle='rgba(104,103,99,.42)';ctx.beginPath();ctx.moveTo(W*.66,0);ctx.lineTo(W*.66,H);ctx.stroke();ctx.strokeStyle='rgba(54,55,53,.58)';for(let j=0;j<4;j++){ctx.beginPath();for(let x=0;x<=W;x+=18){const y=H*.78+j*13+Math.sin(x*.011+j+tt*.05)*18+Math.sin(x*.027+j)*8;x===0?ctx.moveTo(x,y):ctx.lineTo(x,y)}ctx.stroke()}requestAnimationFrame(draw)}
function randomizeArp(){seqOrder=notes.map((_,i)=>i);for(let i=seqOrder.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[seqOrder[i],seqOrder[j]]=[seqOrder[j],seqOrder[i]]}seqXs=seqOrder.map((_,i)=>clamp((i/(notes.length-1))*.84+.08+(Math.random()-.5)*.18,.02,.98));if(Math.random()<.5)seqXs.reverse();seqIndex=0;steps.querySelectorAll('.step').forEach(s=>s.classList.remove('sel'))}function startSeq(){ensureAudio();if(AC.state==='suspended')AC.resume();randomizeArp();isSeq=true;playSeq.classList.add('active');tickSeq()}function stopSequence(){isSeq=false;clearTimeout(seqTimer);seqTimer=null;playSeq.classList.remove('active');steps.querySelectorAll('.step').forEach(s=>s.classList.remove('sel'))}function tickSeq(){if(!isSeq)return;const bpm=parseFloat(bpmEl.value)||90;if(!seqOrder.length)randomizeArp();const idx=seqIndex%seqOrder.length,lane=seqOrder[idx],x=seqXs[idx]??(idx/(notes.length-1));playAt(x,laneToY(lane),.75,.82);steps.querySelectorAll('.step').forEach((s,k)=>s.classList.toggle('sel',k===lane));seqIndex++;seqTimer=setTimeout(tickSeq,60000/bpm*.88)}
function posFromEvent(e){const r=score.getBoundingClientRect();return{x:clamp((e.clientX-r.left)/r.width,0,1),y:clamp((e.clientY-r.top)/r.height,0,1)}}score.addEventListener('pointerdown',e=>{score.setPointerCapture(e.pointerId);const p=posFromEvent(e);playAt(p.x,p.y,1.2,.95);pointer.active=true});score.addEventListener('pointermove',e=>{const p=posFromEvent(e);if(e.buttons||e.pressure>0)playAt(p.x,p.y,.42,.65);else{pointer.x=p.x;pointer.y=p.y;pointer.lane=yToLane(p.y);pointer.midi=xToMidi(p.x,pointer.lane)}});score.addEventListener('pointerup',()=>setTimeout(()=>pointer.active=false,550));
playSeq.addEventListener('click',()=>isSeq?stopSequence():startSeq());stopSeq.addEventListener('click',stopSequence);muteTop.addEventListener('click',()=>{muted=!muted;muteTop.textContent=muted?'UNMUTE':'MUTE';muteTop.classList.toggle('active',muted)});document.getElementById('full').addEventListener('click',()=>document.documentElement.requestFullscreen?.());recBtn.addEventListener('click',toggleRecord);exportMidiBtn.addEventListener('click',exportMidi);waveEl.addEventListener('change',()=>playAt(pointer.x||.5,laneToY(pointer.lane??3),.55,.72));outputEl.addEventListener('input',()=>{if(master)master.gain.value=(parseFloat(outputEl.value)||0)/100});
function vlq(n){let b=n&0x7F,out=[];while((n>>=7)){b<<=8;b|=(n&0x7F)|0x80}while(true){out.push(b&255);if(b&0x80)b>>=8;else break}return out}function buildMIDI(events,tpq,us){const tr=[],ev=(d,a)=>tr.push(...vlq(d),...a);ev(0,[0xff,0x58,4,4,2,24,8]);ev(0,[0xff,0x51,3,(us>>16)&255,(us>>8)&255,us&255]);const flat=[];events.forEach(e=>{const on=Math.max(0,Math.round(e.t*tpq)),off=Math.max(on+1,Math.round((e.t+e.dur)*tpq));flat.push({tick:on,kind:0,bytes:[0x90,e.midi&127,e.vel&127]});flat.push({tick:off,kind:1,bytes:[0x80,e.midi&127,0]})});flat.sort((a,b)=>a.tick===b.tick?a.kind-b.kind:a.tick-b.tick);let tick=0;flat.forEach(f=>{ev(Math.max(0,f.tick-tick),f.bytes);tick=f.tick});ev(0,[0xff,0x2f,0]);const len=tr.length;return new Uint8Array([0x4d,0x54,0x68,0x64,0,0,0,6,0,0,0,1,(tpq>>8)&255,tpq&255,0x4d,0x54,0x72,0x6b,(len>>>24)&255,(len>>>16)&255,(len>>>8)&255,len&255,...tr])}
function exportMidi(){const bpm=parseFloat(bpmEl.value)||90,tpq=480,us=Math.round(60000000/bpm);if(!sessionEvents.length){alert('No recorded session yet. Press REC, play the instrument, then EXPORT MIDI.');return}const events=sessionEvents.map(e=>({t:e.t*bpm/60,midi:e.midi,vel:e.vel,dur:Math.max(.08,e.dur*bpm/60)})).sort((a,b)=>a.t-b.t),bytes=buildMIDI(events,tpq,us),blob=new Blob([bytes],{type:'audio/midi'}),a=document.createElement('a'),stamp=new Date().toISOString().replace(/[:.]/g,'-').slice(0,19);a.href=URL.createObjectURL(blob);a.download='xy_pad_session_'+stamp+'.mid';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1200)}
window.addEventListener('keydown',e=>{if(e.target.matches('input,select'))return;if(e.code==='Space'){e.preventDefault();if(isSeq){clearTimeout(seqTimer);randomizeArp();tickSeq()}else startSeq()}const k=parseInt(e.key,10);if(k>=1&&k<=7)playAt(.5,laneToY(k-1),1.2,.9);if(e.key.toLowerCase()==='w'){const order=['SINE','TRIANGLE','SAW','SQUARE','NOISE'];waveEl.value=order[(order.indexOf(waveEl.value)+1)%order.length];waveEl.dispatchEvent(new Event('change'))}if(e.key.toLowerCase()==='m')muteTop.click()});window.addEventListener('resize',resize);buildSteps();resize();draw();
})();
</script>
</body>
</html>
