<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="./assets/theme.css">
<title>Dual Surface Instrument</title>
<style>
:root{
  --lace:#F4F1EA;
  --stone:#C7C6C1;
  --edge:#777671;
  --charcoal:#686763;
  --deep:#3A3A37;
  --hair:rgba(104,103,99,.26);
  --ghost:rgba(104,103,99,.12);
}
*{box-sizing:border-box}
html,body{
  margin:0;
  height:100%;
  overflow:hidden;
  background:var(--lace);
  color:var(--charcoal);
  font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;
  font-weight:300;
  -webkit-font-smoothing:antialiased;
  text-rendering:geometricPrecision;
}
body{display:grid;place-items:center}
.shell{
  width:min(96vw,1520px);
  height:min(90vh,940px);
  min-height:660px;
  border:.5px solid var(--edge);
  background:var(--lace);
  display:grid;
  grid-template-rows:auto minmax(0,1fr) auto;
  position:relative;
}

.shell:fullscreen{
  width:100vw;
  height:100dvh;
  min-height:0;
  border:0;
}
.shell:-webkit-full-screen{
  width:100vw;
  height:100vh;
  min-height:0;
  border:0;
}
.shell:fullscreen .stage,
.shell:-webkit-full-screen .stage{
  padding-top:18px;
}
.shell:fullscreen .instrument,
.shell:-webkit-full-screen .instrument{
  min-height:0;
}
.shell:fullscreen:before,
.shell:-webkit-full-screen:before{
  display:none;
}
.shell:before{
  content:"";
  position:absolute;
  left:-.5px;
  top:-22px;
  width:132px;
  height:22px;
  border:.5px solid var(--edge);
  border-bottom:0;
  background:var(--lace);
}
.topbar{
  border-bottom:.5px solid var(--hair);
  display:grid;
  grid-template-columns:1fr auto;
  gap:18px;
  align-items:end;
  padding:10px clamp(18px,3vw,42px) 8px;
  font-size:11px;
  line-height:1.2;
  letter-spacing:.13em;
  text-transform:uppercase;
}
.brand{
  margin:0;
  font-size:11px;
  letter-spacing:.16em;
  text-transform:uppercase;
  font-weight:300;
  color:var(--charcoal);
}
.topbar .right{
  display:flex;
  gap:18px;
  justify-content:flex-end;
  align-items:end;
  flex-wrap:wrap;
}
button,input,label,select{
  font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;
  font-weight:300;
  color:var(--charcoal);
}
button{
  appearance:none;
  border:0;
  background:transparent;
  padding:4px 0;
  font-size:11px;
  letter-spacing:.13em;
  text-transform:uppercase;
  cursor:pointer;
  color:var(--charcoal);
}
button:hover{
  color:var(--deep);
  text-decoration:underline;
  text-underline-offset:5px;
}
.masterBpm,.masterSelect{
  border:0;
  border-bottom:.5px solid var(--stone);
  background:transparent;
  border-radius:0;
  outline:none;
  color:var(--charcoal);
  font-size:12px;
  padding:4px 0 5px;
}
.masterBpm{
  width:58px;
  text-align:center;
}
.masterSelect{
  width:70px;
  text-align:left;
  text-transform:uppercase;
  letter-spacing:.13em;
}
.stage{
  min-height:0;
  display:grid;
  grid-template-columns:minmax(0,1fr) minmax(0,1fr);
  gap:42px;
  padding:18px clamp(18px,3vw,42px) 16px;
}
.instrument{
  min-width:0;
  min-height:0;
  border:.5px solid var(--edge);
  background:var(--lace);
  position:relative;
  display:grid;
  grid-template-rows:minmax(0,1fr);
}
.instrument:before{
  content:attr(data-label);
  position:absolute;
  top:-12px;
  left:12px;
  font-size:9px;
  letter-spacing:.15em;
  text-transform:none;
  color:var(--charcoal);
  background:var(--lace);
  padding:0 6px;
  opacity:.68;
}
.instrument--score:before{
  left:auto;
  right:12px;
  text-align:right;
}
.instrument--vector:before{
  left:auto;
  right:12px;
  text-align:right;
}
.instrument iframe{
  width:100%;
  height:100%;
  min-height:0;
  border:0;
  background:var(--lace);
  display:block;
}
.divider{
  position:absolute;
  top:62px;
  bottom:74px;
  left:50%;
  width:.5px;
  background:var(--hair);
  pointer-events:none;
}
.footer{
  border-top:.5px solid var(--hair);
  display:grid;
  grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);
  gap:18px;
  align-items:center;
  padding:12px clamp(18px,3vw,42px) 16px;
  font-size:11px;
  letter-spacing:.13em;
  text-transform:uppercase;
}
.footer .transportCore{
  display:flex;
  gap:24px;
  align-items:center;
  justify-content:center;
  flex-wrap:wrap;
}
.volumeSlot{
  min-width:0;
  display:flex;
  align-items:center;
}
.volumeSlot--left{justify-content:flex-start}
.volumeSlot--right{justify-content:flex-end}
input[type="checkbox"]{
  vertical-align:middle;
  accent-color:var(--deep);
}
.status{
  min-width:84px;
  text-align:center;
  opacity:.74;
}
.surfaceVolume{
  display:flex;
  gap:10px;
  align-items:center;
  color:var(--charcoal);
  font-size:11px;
  letter-spacing:.13em;
  text-transform:uppercase;
}
.surfaceSlider{
  -webkit-appearance:none;
  appearance:none;
  width:108px;
  height:14px;
  background:transparent;
  cursor:pointer;
}
.surfaceSlider::-webkit-slider-runnable-track{
  height:2px;
  background:var(--stone);
  border:0;
  border-radius:999px;
}
.surfaceSlider::-webkit-slider-thumb{
  -webkit-appearance:none;
  appearance:none;
  width:12px;
  height:12px;
  border-radius:50%;
  border:0;
  background:var(--charcoal);
  margin-top:-5px;
}
.surfaceSlider::-moz-range-track{
  height:2px;
  background:var(--stone);
  border:0;
  border-radius:999px;
}
.surfaceSlider::-moz-range-thumb{
  width:12px;
  height:12px;
  border:0;
  border-radius:50%;
  background:var(--charcoal);
}
.surfaceSlider:focus{outline:none}
@media(max-width:1100px){
  html,body{overflow:auto;height:auto;min-height:100%}
  body{display:block;padding:16px;background:var(--lace)}
  .shell{width:100%;height:auto;min-height:0;grid-template-rows:auto auto auto}
  .shell:before{display:none}
  .stage{grid-template-columns:1fr;gap:46px;padding:32px 22px 28px}
  .instrument{height:72vh;min-height:560px}
  .divider{display:none}
  .topbar{grid-template-columns:1fr;justify-items:start;height:auto;min-height:34px;padding:12px 18px;gap:10px}
  .topbar .right,.footer .transportCore{justify-content:flex-start;flex-wrap:wrap}
  .footer{grid-template-columns:1fr;justify-items:start;padding:14px 18px 18px}.volumeSlot--left,.volumeSlot--right{justify-content:flex-start}
}
@media(max-width:560px){
  body{padding:0}
  .shell{border-left:0;border-right:0}
  .instrument{height:68vh;min-height:460px}
}
</style>

<body>
<div class="shell" aria-label="Dual surface instrument">
  <div class="topbar">
    <div class="brand">DUAL SURFACE INSTRUMENT</div>
    <div class="right">
      <a href="./index.html" style="text-decoration:none">COLLECTION</a>
      <label>MASTER KEY <select id="masterKey" class="masterSelect"><option>C</option><option>C#</option><option>D</option><option>Eb</option><option>E</option><option>F</option><option>F#</option><option>G</option><option>Ab</option><option>A</option><option>Bb</option><option>B</option></select></label>
      <button id="fullSurface" type="button">FULL</button>
    </div>
  </div>

  <main class="stage">
    <section class="instrument instrument--score" data-label="01 / Draw Score Grid">
      <iframe id="livingFrame" title="Living Score" sandbox="allow-scripts allow-same-origin allow-downloads allow-forms allow-pointer-lock allow-modals" allow="autoplay; fullscreen" allowfullscreen></iframe>
    </section>
    <section class="instrument instrument--vector" data-label="02 / Vector Field">
      <iframe id="xyFrame" title="XY Pad Instrument" sandbox="allow-scripts allow-same-origin allow-downloads allow-forms allow-pointer-lock allow-modals" allow="autoplay; fullscreen" allowfullscreen></iframe>
    </section>
    <div class="divider"></div>
  </main>

  <div class="footer">
    <div class="volumeSlot volumeSlot--left">
      <label class="surfaceVolume">SCORE VOL <input id="livingVolume" class="surfaceSlider" type="range" min="0" max="100" value="41"></label>
    </div>
    <div class="transportCore">
      <button id="playBoth">PLAY BOTH</button>
      <button id="stopAll">STOP ALL</button>
      <button id="clearLeft">CLEAR SCORE</button>
      <span id="status" class="status">READY</span>
    </div>
    <div class="volumeSlot volumeSlot--right">
      <label class="surfaceVolume">VECTOR VOL <input id="xyVolume" class="surfaceSlider" type="range" min="0" max="100" value="38"></label>
    </div>
  </div>
</div>

  };

  const livingFrame = document.getElementById('livingFrame');
  const xyFrame = document.getElementById('xyFrame');
  const masterKey = document.getElementById('masterKey');
  const livingVolume = document.getElementById('livingVolume');
  const xyVolume = document.getElementById('xyVolume');
  const status = document.getElementById('status');
  const shell = document.querySelector('.shell');
  const fullSurface = document.getElementById('fullSurface');

  function decodeBase64UTF8(b64){
    const bin = atob(b64);
    const bytes = new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
    return new TextDecoder('utf-8').decode(bytes);
  }

  livingFrame.srcdoc = decodeBase64UTF8(encoded.living);
  xyFrame.srcdoc = decodeBase64UTF8(encoded.xy);

  function doc(frame){
    try { return frame.contentWindow && frame.contentWindow.document; }
    catch(e) { return null; }
  }


  function fullscreenElement(){
    return document.fullscreenElement || document.webkitFullscreenElement || null;
  }

  function requestShellFullscreen(){
    if(!shell) return;
    const req = shell.requestFullscreen || shell.webkitRequestFullscreen;
    if(req) req.call(shell);
  }

  function exitShellFullscreen(){
    const exit = document.exitFullscreen || document.webkitExitFullscreen;
    if(exit) exit.call(document);
  }

  function updateFullscreenButton(){
    const active = fullscreenElement() === shell;
    if(fullSurface) fullSurface.textContent = active ? 'EXIT' : 'FULL';
    if(active) status.textContent = 'FULL';
  }

  function click(frame, id){
    const d = doc(frame);
    const el = d && d.getElementById(id);
    if(el) {
      el.click();
      return true;
    }
    return false;
  }

  function setInput(frame, id, value){
    const d = doc(frame);
    const el = d && d.getElementById(id);
    if(el) {
      el.value = value;
      el.dispatchEvent(new Event('input', {bubbles:true}));
      el.dispatchEvent(new Event('change', {bubbles:true}));
      return true;
    }
    return false;
  }

  let syncingKey = false;
  function syncKey(sourceFrame=null){
    if(syncingKey) return; // guard: setInput() dispatches 'change' on the target frame,
    syncingKey = true;     // which would otherwise ping-pong back into this function
    try {
      const key = masterKey.value || 'C';
      if(sourceFrame !== livingFrame) setInput(livingFrame, 'key', key);
      if(sourceFrame !== xyFrame) setInput(xyFrame, 'key', key);
      setInput(xyFrame, 'scale', 'minor');
      status.textContent = 'KEY ' + key;
    } finally {
      syncingKey = false;
    }
  }

  function setFrameVolume(frame, slider){
    const win = frame.contentWindow;
    const gain = Math.max(0, Math.min(1, (Number(slider.value)||0) / 100));
    try {
      if(win && typeof win.SURFACE_SET_VOLUME === 'function'){
        win.SURFACE_SET_VOLUME(frame === livingFrame ? gain * 3 : gain * .75);
        return true;
      }
    } catch(e) {}
    if(frame === xyFrame) return setInput(xyFrame, 'output', Math.round(gain * 75));
    return false;
  }

  function applyVolumes(){
    setFrameVolume(livingFrame, livingVolume);
    setFrameVolume(xyFrame, xyVolume);
  }

  function attachFrameSync(){
    const pairs = [
      {frame: livingFrame, id: 'key'},
      {frame: xyFrame, id: 'key'}
    ];
    pairs.forEach(({frame,id}) => {
      const d = doc(frame);
      const el = d && d.getElementById(id);
      if(!el || el.dataset.universalKeyBound) return;
      el.dataset.universalKeyBound = '1';
      el.addEventListener('change', () => {
        masterKey.value = el.value;
        syncKey(frame);
      });
    });
  }

  function armAudioFrames(){
    // Audio is still browser-gated by user gesture. These calls run inside the click gesture.
    const lwin = livingFrame.contentWindow;
    const xwin = xyFrame.contentWindow;
    try { if(lwin && lwin.AC && lwin.AC.state === 'suspended') lwin.AC.resume(); } catch(e) {}
    try { if(xwin && xwin.AC && xwin.AC.state === 'suspended') xwin.AC.resume(); } catch(e) {}
  }


  if(fullSurface){
    fullSurface.addEventListener('click', () => {
      if(fullscreenElement() === shell) exitShellFullscreen();
      else requestShellFullscreen();
    });
  }
  document.addEventListener('fullscreenchange', updateFullscreenButton);
  document.addEventListener('webkitfullscreenchange', updateFullscreenButton);

  masterKey.addEventListener('change', () => syncKey());
  livingVolume.addEventListener('input', () => setFrameVolume(livingFrame, livingVolume));
  xyVolume.addEventListener('input', () => setFrameVolume(xyFrame, xyVolume));

  [livingFrame, xyFrame].forEach(frame => {
    frame.addEventListener('load', () => {
      attachFrameSync();
      syncKey();
    });
  });

  document.getElementById('playBoth').addEventListener('click', () => {
    syncKey();
    armAudioFrames();
    applyVolumes();
    const a = click(livingFrame, 'read');
    const b = click(xyFrame, 'playSeq');
    status.textContent = (a || b) ? 'PLAYING' : 'LOADING';
  });

  document.getElementById('stopAll').addEventListener('click', () => {
    click(livingFrame, 'stop');
    click(xyFrame, 'stopSeq');
    status.textContent = 'STOPPED';
  });

  document.getElementById('clearLeft').addEventListener('click', () => {
    click(livingFrame, 'clear');
    status.textContent = 'CLEARED';
  });

  window.addEventListener('message', () => {});
  setTimeout(() => { attachFrameSync(); syncKey(); }, 500);
})();
</script>
